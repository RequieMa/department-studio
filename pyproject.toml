[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "department-studio"
version = "0.1.0"
description = "A user-led room for configurable agent departments"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "filelock>=4.2.12",
    "pydantic>=2.14.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
department-studio = "department_studio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/department_studio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["browser: browser integration tests", "live: explicitly authorized live runtime tests"]
addopts = "-m 'not browser and not live'"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.65.2",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]
